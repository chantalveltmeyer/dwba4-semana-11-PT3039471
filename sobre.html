    <script type="text/babel">

        function Sobre() {
            return (
                <div className="conteudo">

                    <p>
                        <strong>
                            O Instituto Federal de Educação, Ciência e Tecnologia de São Paulo
                        </strong> é uma autarquia federal de ensino.
                    </p>

                    <p>
                        Fundada em 1909, como Escola de Aprendizes Artífices, é reconhecida pela sociedade paulista por sua excelência no ensino público gratuito de qualidade.
                    </p>

                    <p>
                        Durante sua história, recebeu também os nomes de Escola Técnica Federal de São Paulo e Centro Federal de Educação Tecnológica de São Paulo.
                    </p>

                    <p>
                        Com a transformação em Instituto, em dezembro de 2008, passou a ter relevância de universidade.
                    </p>

                    <p>
                        Com a mudança, o Instituto Federal de São Paulo passou a destinar 50% das vagas para os cursos técnicos e, no mínimo, 20% das vagas para os cursos de licenciatura.
                    </p>

                    <p>
                        Além dos cursos presenciais, o IFSP oferece cursos técnicos em Administração e em Informática para Internet.
                    </p>

                    <p>
                        O IFSP é organizado em diversos câmpus e possui mais de 40 mil alunos matriculados.
                    </p>

                    <p>
                        Localizado em <strong>Rua Pedro Vicente, 625 - Canindé - São Paulo - SP - Brasil - CEP: 01109-010</strong>
                    </p>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Sobre />);
