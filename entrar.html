<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f5f5f5;
        }

        /* MENU */
        .menu {
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0;
        }

        .menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
        }

        .menu li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }

        .menu li a:hover,
        .menu .ativo {
            background-color: #444;
        }

        .sobre a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }

        /* LOGO */
        .logo-area {
            background-color: #008000;
            height: 120px;
            display: flex;
            align-items: center;
        }

        .logo-area img {
            height: 90px;
            margin-left: 15px;
        }

        /* LOGIN */
        .login-box {
            max-width: 320px;
            margin: 60px auto;
            text-align: center;
        }

        .login-box img {
            width: 45px;
            margin-bottom: 15px;
        }

        .btn-login {
            width: 100%;
        }

        /* RODAPÉ */
        .copyright {
            text-align: center;
            color: gray;
            margin-top: 40px;
            margin-bottom: 70px;
        }

        .facebook {
            margin-left: 10px;
            margin-bottom: 20px;
        }

        .facebook img {
            width: 50px;
            height: 50px;
        }

        .endereco {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <!-- MENU -->
    <header>
        <nav class="menu">

            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="#">EVENTOS</a></li>
                <li><a href="#">CONTATO</a></li>
                <li><a href="#">CURSOS</a></li>
                <li><a class="ativo" href="entrar.html">ENTRAR</a></li>
            </ul>

            <div class="sobre">
                <a href="sobre.html">SOBRE</a>
            </div>

        </nav>
    </header>

    <!-- LOGO -->
    <section class="logo-area">
        <img src="https://raw.githubusercontent.com/DWBA4/dwba4_semana_imagens/master/Logo.jpg" alt="IFSP">
    </section>

    <!-- LOGIN -->
    <div class="login-box">

        <img src="https://raw.githubusercontent.com/DWBA4/dwba4_semana_imagens/master/ifsp.png" alt="ifsp.png">

        <h1 class="h2 mb-4">Faça login</h1>

        <form>

            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="Seu email">
                <label for="email">Seu email</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="senha" placeholder="Senha">
                <label for="senha">Senha</label>
            </div>

            <div class="form-check my-3">
                <input class="form-check-input" type="checkbox" id="lembrar">
                <label class="form-check-label" for="lembrar">
                    Lembrar de mim
                </label>
            </div>

            <a href="#" class="d-block mb-3">
                Esqueci a senha
            </a>

            <button type="submit" class="btn btn-primary btn-lg btn-login">
                Login
            </button>

        </form>

    </div>

    <!-- RODAPÉ -->
    <div class="copyright">
        © 2020
    </div>

    <div class="facebook">
        <img src="https://raw.githubusercontent.com/DWBA4/dwba4_semana_imagens/master/facebook.png" alt="Facebook">
    </div>

    <div class="endereco">
        IFSP - Câmpus Pirituba - Av. Mutinga, 951 - Jardim Santo Elias -
        CEP: 05110-000 - São Paulo/SP - Contato: (011) 2504-0100
    </div>

</body>

</html>
